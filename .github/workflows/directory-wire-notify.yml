# On merge to main touching directory/, poke the site repo to run its
# Directory Wire workflow (repository_dispatch: directory-merge). This is the
# instant path; the site's nightly cron is the backstop either way.
#
# Needs SITE_DISPATCH_PAT: a fine-grained PAT on Haustorium12/24klabs-site with
# Contents: read-write (repository_dispatch requires it), stored as an Actions
# secret in THIS repo. Until it's configured this workflow exits green with a
# note -- a missing PAT must not paint merges red; the nightly covers the gap.

name: Directory Wire Notify

on:
  push:
    branches: [main]
    paths:
      - 'directory/**'

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch to 24klabs-site
        env:
          PAT: ${{ secrets.SITE_DISPATCH_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "SITE_DISPATCH_PAT not configured; the site's nightly wire run will pick this merge up."
            exit 0
          fi
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            https://api.github.com/repos/Haustorium12/24klabs-site/dispatches \
            -d '{"event_type":"directory-merge","client_payload":{"gold402_sha":"${{ github.sha }}"}}'
          echo "Dispatched directory-merge to 24klabs-site."
